name: R1 매물 감시

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드 (그대로 두세요)"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: r1-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 브라우저 설치
        run: python -m playwright install --with-deps chromium
      - name: 매물 검사
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          RUN_MODE: ${{ inputs.mode == 'auto' && 'schedule' || github.event_name }}
        run: python r1_monitor.py
      - name: 확인한 매물 목록 저장
        if: always()
        run: |
          git config user.name "r1-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "seen 업데이트" && git pull --rebase && git push)
